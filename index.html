<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>School Calendar</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">MARIN CATHOLIC</p><h1>School calendar</h1><p class="subhead">Upcoming events, all in one place.</p></div></header>
<section class="calendar"><div class="calendar-head"><button id="prev" aria-label="Previous month">‹</button><h2 id="month-title"></h2><button id="next" aria-label="Next month">›</button><button id="today" class="today">Today</button></div><p class="calendar-note">Assignments appear throughout their due week; each is labeled with its due day.</p><div class="weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div id="grid" class="grid"></div></section>
<section class="upcoming"><div class="event-columns"><section class="event-column"><div class="section-head"><h2>Classes</h2><span id="class-count"></span></div><div id="classes" class="event-list"></div></section><section class="event-column"><div class="section-head"><h2>Assignments</h2><span id="assignment-count"></span></div><div id="assignments" class="event-list"></div></section></div></section><footer><span id="updated"></span><span>Times shown in your local timezone</span></footer></main><script src="app.js" defer></script></body></html>
