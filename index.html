<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07080c">
  <meta name="description" content="MCTools school calendar and assignment dashboard for Marin Catholic.">
  <title>MCTools — School Calendar</title>
  <style>
    :root{color-scheme:dark;--bg:#07080c;--panel:#10131a;--panel-2:#141821;--line:rgba(255,255,255,.08);--ink:#f4f7fb;--muted:#8a929f;--blue:#70d8ff;--mint:#72e5c3;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(ellipse at 50% -20%,rgba(55,117,174,.15),transparent 45%),var(--bg);color:var(--ink)}button{font:inherit}.topbar{height:58px;position:sticky;top:0;z-index:20;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(7,8,12,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.nav{width:min(1160px,calc(100% - 40px));margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:14px;font-weight:650;letter-spacing:-.03em;text-decoration:none}.brand-mark{display:grid;width:26px;height:26px;place-items:center;border-radius:9px;background:linear-gradient(145deg,#ddf7ff,#5ccafa 55%,#7d83ff);color:#071019;font-size:9px;font-weight:800;box-shadow:0 0 24px rgba(70,188,255,.24)}.nav-note{color:#858d99;font-size:11px}.nav-status{display:flex;align-items:center;gap:8px;color:#aab3bf;font-size:11px}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px rgba(114,229,195,.65)}.wrap{width:min(1160px,calc(100% - 40px));margin:auto;padding:46px 0 38px}.page-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:24px}.eyebrow{margin:0 0 9px;color:#8b96a7;font-size:10px;font-weight:650;letter-spacing:.16em;text-transform:uppercase}.page-heading h1{margin:0;font-size:clamp(32px,4vw,48px);line-height:1.04;font-weight:620;letter-spacing:-.065em}.page-heading p{margin:10px 0 0;color:var(--muted);font-size:13px}.today-label{color:#adb7c5;font-size:12px;white-space:nowrap}.panel{position:relative;isolation:isolate;border:1px solid rgba(255,255,255,.09);border-radius:25px;background:linear-gradient(145deg,rgba(19,23,32,.97),rgba(12,15,21,.98));box-shadow:0 24px 75px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.035)}.panel::before{content:"";position:absolute;z-index:0;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(125deg,rgba(86,204,255,.5),rgba(135,116,255,.16) 30%,transparent 62%,rgba(82,220,206,.23));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.42;animation:borderPulse 8s ease-in-out infinite}.panel>*{position:relative;z-index:1}.calendar-panel{padding:23px 24px 22px}.calendar-head{display:flex;align-items:center;gap:10px;margin-bottom:19px}.calendar-head h2{margin:0 auto 0 0;font-size:22px;font-weight:600;letter-spacing:-.045em}.month-controls{display:flex;gap:7px}.icon-button,.today-button{height:34px;border:1px solid rgba(255,255,255,.11);border-radius:11px;background:rgba(255,255,255,.045);color:#dce3ec;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}.icon-button{width:36px;font-size:18px}.today-button{padding:0 13px;font-size:11px;font-weight:600}.icon-button:hover,.today-button:hover{background:rgba(255,255,255,.1);border-color:rgba(112,216,255,.32);transform:translateY(-1px)}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{padding:0 0 8px;color:#788392;font-size:9px;font-weight:650;letter-spacing:.12em;text-transform:uppercase}.weekdays span{text-align:right;padding-right:11px}.grid{border-top:1px solid var(--line);border-left:1px solid var(--line);overflow:hidden;border-radius:13px}.day{position:relative;min-width:0;min-height:112px;padding:8px 8px 9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(255,255,255,.012);overflow:hidden;transition:background .2s}.day:hover{background:rgba(255,255,255,.035)}.day.outside{background:rgba(0,0,0,.1)}.day-num{display:grid;width:25px;height:25px;place-items:center;margin:0 0 5px auto;color:#9ba5b2;font-size:11px;font-weight:550;border-radius:9px}.day.outside .day-num{color:#505966}.day.today .day-num{background:linear-gradient(145deg,#dff9ff,#65d2ff);color:#07121a;font-weight:750;box-shadow:0 0 18px rgba(92,202,255,.25)}.chip{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:3px 0;padding:5px 6px;border:1px solid rgba(99,179,255,.14);border-left:2px solid #69caff;border-radius:7px;background:linear-gradient(100deg,rgba(57,125,190,.17),rgba(68,83,135,.11));color:#c8eaff;text-align:left;font-size:9px;line-height:1.25;cursor:pointer;animation:blockFloat 7s ease-in-out infinite}.chip:nth-of-type(2){animation-delay:-2.3s}.chip:nth-of-type(3){animation-delay:-4.6s}.chip:hover{background:rgba(63,145,211,.25)}.more{padding:3px 5px;color:#818b98;font-size:9px}.dashboard{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(290px,.75fr);gap:18px;margin-top:18px}.list-panel{min-height:280px;padding:21px 22px 16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:15px;border-bottom:1px solid var(--line)}.section-head h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.035em}.section-head span{color:#818b99;font-size:10px;white-space:nowrap}.event-list{display:flex;flex-direction:column}.event{display:flex;align-items:center;gap:13px;min-height:69px;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.065);animation:itemEnter .45s ease both}.event:last-child{border-bottom:0}.event:nth-child(2){animation-delay:.04s}.event:nth-child(3){animation-delay:.08s}.event:nth-child(4){animation-delay:.12s}.event:nth-child(5){animation-delay:.16s}.date-box{display:grid;align-content:center;justify-items:center;flex:0 0 43px;width:43px;height:45px;border:1px solid rgba(112,216,255,.15);border-radius:13px;background:linear-gradient(145deg,rgba(53,128,190,.19),rgba(39,48,80,.28));color:#e4f6ff}.date-box b{font-size:17px;line-height:1;font-weight:620;letter-spacing:-.04em}.date-box small{margin-top:4px;color:#82d6f8;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.assignment-event .date-box{border-color:rgba(126,140,255,.2);background:linear-gradient(145deg,rgba(100,95,190,.2),rgba(45,48,81,.27))}.assignment-event .date-box small{color:#b7b9ff}.event h3{margin:0 0 5px;color:#edf2f8;font-size:12px;font-weight:600}.event p{margin:0;color:#818b99;font-size:10px;line-height:1.45}.empty{margin:0;padding:24px 2px;color:#8993a0;font-size:12px}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:22px;color:#606a77;font-size:10px}.ambient-widget{position:fixed;right:max(22px,calc((100vw - 1220px)/2));top:125px;z-index:-1;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(42,123,180,.09),transparent 68%);filter:blur(2px);animation:orbDrift 12s ease-in-out infinite;pointer-events:none}@keyframes borderPulse{0%,100%{opacity:.25}50%{opacity:.68}}@keyframes blockFloat{0%,100%{translate:0 0}50%{translate:0 -2px}}@keyframes itemEnter{from{opacity:0;translate:0 5px}to{opacity:1;translate:0 0}}@keyframes orbDrift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-18px,16px,0)}}@media(max-width:800px){.wrap{padding-top:31px}.dashboard{grid-template-columns:1fr}.list-panel{min-height:200px}.day{min-height:88px;padding:6px 5px}.chip{font-size:8px;padding:4px}.calendar-panel{padding:17px 15px}.ambient-widget{display:none}}@media(max-width:520px){.nav,.wrap{width:calc(100% - 24px)}.wrap{padding-top:27px}.nav-note{display:none}.page-heading{align-items:flex-start;flex-direction:column;gap:10px;margin-bottom:18px}.page-heading h1{font-size:34px}.calendar-panel{padding:13px 9px}.calendar-head{gap:5px;margin-bottom:12px}.calendar-head h2{font-size:18px}.icon-button{width:31px;height:32px}.today-button{height:32px;padding:0 9px}.weekdays{font-size:8px;letter-spacing:.07em}.weekdays span{padding-right:5px}.day{min-height:70px;padding:4px 3px}.day-num{width:21px;height:21px;font-size:10px}.chip{padding:4px 3px;font-size:7px}.list-panel{padding:17px 14px 12px;border-radius:20px}.dashboard{gap:13px}.footer{flex-direction:column}.ambient-widget{display:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="ambient-widget" aria-hidden="true"></div>
  <header class="topbar"><nav class="nav" aria-label="Main navigation"><a class="brand" href="#top"><span class="brand-mark">MC</span><span>MCTools</span></a><span class="nav-note">Marin Catholic · Academic calendar</span><span class="nav-status"><span class="status-dot" aria-hidden="true"></span>Calendar feed</span></nav></header>
  <main id="top" class="wrap">
    <section class="page-heading" aria-labelledby="page-title"><div><p class="eyebrow">Your school week</p><h1 id="page-title">Calendar &amp; assignments</h1><p>Classes by day. Upcoming work by due date.</p></div><div id="today-label" class="today-label"></div></section>
    <section class="panel calendar-panel" aria-labelledby="month-title"><div class="calendar-head"><h2 id="month-title"></h2><div class="month-controls"><button class="icon-button" id="prev" aria-label="Previous month">‹</button><button class="today-button" id="today">Today</button><button class="icon-button" id="next" aria-label="Next month">›</button></div></div><div class="weekdays" aria-hidden="true"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div id="grid" class="grid" aria-live="polite"></div></section>
    <section class="dashboard" aria-label="Upcoming schedule and assignments"><section class="panel list-panel" aria-labelledby="assignments-heading"><div class="section-head"><h2 id="assignments-heading">Upcoming assignments</h2><span id="assignment-count"></span></div><div id="assignments" class="event-list"></div></section><section class="panel list-panel" aria-labelledby="classes-heading"><div class="section-head"><h2 id="classes-heading">Classes today</h2><span id="class-count"></span></div><div id="classes" class="event-list"></div></section></section>
    <footer class="footer"><span id="updated">MCTools · Marin Catholic</span><span>Times shown in your local timezone</span></footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
